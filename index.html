<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta property="og:description" content="Daily motivation and Bible verses. Pick a day to read its quote or verse.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #14213d;
    --chalk: #f2f4f8;
    --paper: #ffffff;
    --sun: #ffcf33;
    --mute: #6b7691;
    --line: #d5dbe7;
    --lock: #a4adc2;
    --panel-mute: #9aa6c4;
    --ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--chalk);
    color: var(--ink);
    font-family: var(--ui);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 20px 56px;
  }

  header { padding-right: 64px; }

  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.7rem, 5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  header p {
    margin: 0 0 24px;
    color: var(--mute);
    font-size: 0.98rem;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 440px) 1fr;
    gap: 24px;
    align-items: stretch;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Mode switch ---------- */
  .mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    flex: none;
  }

  .mode button {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    height: 40px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode button:not([aria-pressed="true"]):hover { background: var(--chalk); }
  .mode button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- Calendar ---------- */
  .cal {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 18px;
    padding: 16px;
  }

  .cal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex: none;
  }

  .cal-head h2 {
    flex: 1;
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .icon-btn, .text-btn {
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .icon-btn { width: 38px; height: 38px; font-size: 1.2rem; line-height: 1; }
  .text-btn { height: 38px; padding: 0 14px; font-size: 0.9rem; font-weight: 600; }
  .icon-btn:hover, .text-btn:hover { border-color: var(--ink); background: var(--chalk); }

  .dow, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .dow span {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--mute);
    padding-bottom: 6px;
  }

  .day {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    aspect-ratio: 1;
    min-height: 0;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .day:hover { background: var(--chalk); }

  .day.today { background: var(--sun); }
  .day.today:hover { background: #ffc61a; }

  .day.selected { background: var(--ink); color: #fff; }
  .day.today.selected { color: var(--sun); box-shadow: inset 0 0 0 2px var(--sun); }

  .day.locked {
    color: var(--lock);
    font-weight: 400;
    border: 1.5px dashed var(--line);
  }
  .day.locked:hover { background: transparent; border-color: var(--lock); }
  .day.locked.selected { background: var(--chalk); color: var(--mute); border-color: var(--mute); }

  .blank { visibility: hidden; }

  :focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .day.selected:focus-visible { outline-color: var(--sun); }

  /* ---------- Quote / verse card (side panel + popup) ---------- */
  .card {
    background: var(--ink);
    color: var(--chalk);
    border-radius: 18px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel { align-self: stretch; min-height: 340px; }

  .card .numeral {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(3.4rem, 9vw, 4.8rem);
    line-height: 0.9;
    color: var(--sun);
  }

  .card .day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .card .meta {
    margin: 0 0 12px;
    font-size: 0.9rem;
    color: var(--panel-mute);
  }

  .share-inline {
    flex: none;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 6px 10px;
    color: #ff8a1f;
    background: transparent;
    border: 1.5px solid #ff8a1f;
    border-radius: 8px;
    cursor: pointer;
  }
  .share-inline:hover { background: rgba(255, 138, 31, 0.14); }
  .share-inline:focus-visible { outline-color: var(--sun); }
  .share-inline:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (min-width: 900px) {
    .share-inline { display: none; }
  }

  .card blockquote {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(1.3rem, 4.6vw, 1.7rem);
    line-height: 1.35;
    font-weight: 500;
  }

  .card .author {
    margin: 16px 0 0;
    font-size: 0.95rem;
    color: var(--panel-mute);
  }

  .card.is-locked .numeral { color: #56648a; }
  .card.is-locked .lock-title { margin: 0 0 6px; font-size: 1.3rem; font-weight: 600; }
  .card.is-locked .lock-note { margin: 0; color: var(--panel-mute); }

  .swap { animation: swap 0.22s ease-out; }
  @keyframes swap {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Popup (mobile) ---------- */
  dialog {
    width: min(92vw, 460px);
    max-width: none;
    max-height: 88dvh;
    margin: auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    overflow: visible;
  }
  dialog::backdrop { background: rgba(10, 16, 32, 0.62); }
  dialog[open] { animation: pop 0.2s ease-out; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .dialog-inner { position: relative; }
  .dialog-inner .card { padding: 26px 24px 28px; }
  .dialog-mode { margin-bottom: 10px; }

  .dialog-icon-btn {
    position: absolute;
    top: -46px;
    right: 4px;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    font: inherit;
    background: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    cursor: pointer;
  }
  .dialog-icon-btn:hover { opacity: 0.75; }
  .dialog-icon-btn:focus-visible { outline-color: var(--sun); }
  .dialog-icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .dialog-close {
    font-size: 1.8rem;
    line-height: 1;
    color: #ff3b30;
  }

  /* Mobile shares from inside the popup; desktop shares from the floating bubble */
  @media (max-width: 899px) {
    #shareBtn { display: none; }
  }

  .dialog-wave {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    text-decoration: none;
    background: none;
  }
  .dialog-wave span { display: inline-block; transform-origin: 70% 70%; animation: wave 2.2s ease-in-out infinite; }
  .dialog-wave svg { width: 36px; height: 36px; display: block; fill: none; stroke: #ff8a1f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dialog-wave:focus-visible { outline-color: var(--chalk); }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0); }
    10%, 30% { transform: rotate(16deg); }
    20%, 40% { transform: rotate(-10deg); }
    50% { transform: rotate(8deg); }
  }

  /* ---------- Top-right action bubbles ---------- */
  .top-actions {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    gap: 10px;
  }

  .bubble {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: var(--ink);
    background: var(--sun);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 4px 14px rgba(20, 33, 61, 0.25);
    transition: transform 0.15s, opacity 0.15s;
    cursor: pointer;
    font: inherit;
  }
  .bubble:hover { transform: scale(1.07); }
  .bubble:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* ---------- Bottom-right contact avatar ---------- */
  .avatar-bubble {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    width: 52px;
    height: 52px;
    padding: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(20, 33, 61, 0.25);
    transition: transform 0.15s;
    cursor: pointer;
  }
  .avatar-bubble:hover { transform: scale(1.07); }
  .avatar-bubble img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- Contact modal (WhatsApp-style chat) ---------- */
  .contact-inner { position: relative; }

  .wa-card {
    background: #ece5dd;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .wa-header {
    background: #075e54;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
  }

  .wa-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    flex: none;
  }

  .wa-header-text { display: flex; flex-direction: column; min-width: 0; }
  .wa-name { font-size: 1.02rem; font-weight: 700; }
  .wa-status { font-size: 0.8rem; color: #d3e6e2; }

  .wa-body {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 140px;
  }

  .wa-bubble {
    align-self: flex-start;
    max-width: 88%;
    background: #fff;
    color: #111b21;
    padding: 10px 14px;
    border-radius: 8px 8px 8px 2px;
    font-size: 0.95rem;
    line-height: 1.45;
    text-align: left;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
  }

  #waTypingBubble { display: flex; align-items: center; gap: 4px; padding: 12px 16px; }
  .wa-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #99a3a1;
    animation: wa-bounce 1.2s infinite;
  }
  .wa-dot:nth-child(2) { animation-delay: 0.15s; }
  .wa-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes wa-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .wa-bubble-contact p { margin: 0 0 10px; }

  .wa-contact-icons {
    display: flex;
    gap: 14px;
  }

  .contact-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #fff;
    text-decoration: none;
    transition: transform 0.15s;
  }
  .contact-icon:hover { transform: scale(1.07); }
  .contact-icon svg { width: 22px; height: 22px; }
  .contact-icon.whatsapp { background: #25d366; }
  .contact-icon.email { background: var(--sun); color: var(--ink); }
  .contact-icon.linkedin { background: #0a66c2; }

  /* ---------- Share toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    z-index: 30;
    max-width: min(90vw, 360px);
    padding: 12px 18px;
    background: var(--ink);
    color: var(--chalk);
    font-size: 0.9rem;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(20, 33, 61, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Desktop: quote appears on the right ---------- */
  @media (min-width: 900px) {
    .card blockquote { font-size: 1.85rem; }
    .panel { padding: 36px; }
  }

  /* ---------- Mobile: everything fits the screen, no scrolling ---------- */
  @media (max-width: 899px) {
    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 12px 12px;
      overflow: hidden;
    }

    header h1 { margin: 0; font-size: 1.35rem; }
    header p { display: none; }
    header { flex: none; min-height: 48px; display: flex; align-items: center; }

    .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .left { flex: 1; min-height: 0; }
    .panel { display: none; }

    .cal {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 540px;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .cal-head { margin-bottom: 8px; }
    .cal-head { gap: 6px; }
    .cal-head h2 { font-size: 1.1rem; white-space: nowrap; }
    .icon-btn, .text-btn { height: 36px; }
    .icon-btn { width: 36px; }
    .dow { flex: none; }
    .dow span { padding-bottom: 4px; }

    .grid { flex: 1 1 0; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
    .day { aspect-ratio: auto; height: 100%; }
  }

  @media (max-width: 360px) {
    .cal-head h2 { font-size: 1rem; }
    .text-btn { padding: 0 9px; font-size: 0.8rem; }
    .icon-btn { width: 32px; }
  }

  /* Short landscape screens: let the page scroll instead of squashing */
  @media (max-width: 899px) and (max-height: 480px) {
    .app { height: auto; min-height: 100dvh; overflow: visible; }
    .cal { max-height: none; }
    .grid { grid-auto-rows: minmax(34px, auto); }
  }

  @media (prefers-reduced-motion: reduce) {
    .swap, dialog[open], .dialog-wave span { animation: none; }
    * { transition: none !important; }
  }

  /* ---------- Footer credit ---------- */
  .credit {
    flex: none;
    margin-top: 18px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--mute);
  }

  @media (max-width: 899px) {
    .credit { margin-top: 8px; font-size: 0.72rem; }
  }
</style>
</head>

<body>
<main class="app">
  <header>
    <div>
      <h1>Motivation Calendar</h1>
      <p>Pick a day to read its quote or verse. Days ahead unlock when they arrive.</p>
    </div>

  <div class="layout">

  </div>

  <footer class="credit">A Kevin Malomba Production</footer>
</main>

  </div>
</dialog>

<div class="top-actions">

      <path d="M12 15V3"></path>
      <path d="m7 8 5-5 5 5"></path>

</div>

</button>

        <div class="wa-bubble wa-bubble-contact" id="waContactBubble" hidden>
          <p>Reach out to me for business via</p>
          <div class="wa-contact-icons">

<script>
  // Deterrents against casual source viewing / DevTools (cannot be made absolute)
  (function () {
    const block = e => { e.preventDefault(); e.stopPropagation(); return false; };

    // Right-click menu
    document.addEventListener('contextmenu', block);

    // Shortcuts: F12, Ctrl+U / S / P, Ctrl+Shift+I / J / C / K, Cmd+Opt+I / J / C / U
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      const mod = e.ctrlKey || e.metaKey;
      if (
        e.key === 'F12' ||
        (mod && ['u', 's', 'p'].includes(k)) ||
        (mod && e.shiftKey && ['i', 'j', 'c', 'k'].includes(k)) ||
        (e.metaKey && e.altKey && ['i', 'j', 'c', 'u'].includes(k))
      ) return block(e);
    }, true);

    // Text selection / drag copying
    document.addEventListener('selectstart', e => {
      if (!/^(input|textarea)$/i.test(e.target.tagName)) block(e);
    });
    document.addEventListener('dragstart', block);

    // DevTools detection: wipe the page when DevTools is opened
    let tripped = false;
    const trip = () => {
      if (tripped) return;
      tripped = true;
      document.documentElement.innerHTML =
        '<body style="margin:0;display:grid;place-items:center;height:100vh;' +
        'font-family:sans-serif;background:#111;color:#eee">' +
        '<p>Developer tools are not allowed on this page.</p></body>';
    };

    // 1) Docked DevTools change window inner/outer size
    const sizeCheck = () => {
      const t = 160;
      if (window.outerWidth - window.innerWidth > t ||
          window.outerHeight - window.innerHeight > t) trip();
    };

    // 2) Console getter trick: fires when the console is open
    const el = new Image();
    Object.defineProperty(el, 'id', { get: trip });
    const consoleCheck = () => { console.log(el); console.clear(); };

    // 3) debugger timing: stalls only while DevTools is open
    const debuggerCheck = () => {
      const s = performance.now();
      (function () {}).constructor('debugger')();
      if (performance.now() - s > 100) trip();
    };

    setInterval(() => { sizeCheck(); consoleCheck(); debuggerCheck(); }, 1000);
  })();
</script>

  // step must not share a factor with the list length, so every entry is used before any repeats
  const MODES = {
    motivation: { items: QUOTES, step: 37, noun: "quote", credit: a => a },
    verse:      { items: VERSES, step: 41, noun: "verse", credit: a => `${a} (KJV)` }
  };

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const DAY_MS = 86400000;

  const grid = document.getElementById("grid");
  const panel = document.getElementById("quotePanel");
  const dialog = document.getElementById("quoteDialog");
  const dialogCard = document.getElementById("dialogCard");
  const monthLabel = document.getElementById("monthLabel");
  const modeButtons = document.querySelectorAll("[data-mode]");
  const shareBtn = document.getElementById("shareBtn");
  const dialogShareBtn = document.getElementById("dialogShareBtn");
  const toast = document.getElementById("toast");
  const mobileQuery = window.matchMedia("(max-width: 899px)");

  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = () => startOfDay(new Date());
  const sameDay = (a, b) => a.getTime() === b.getTime();
  const longDate = d => `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  const state = {
    view: new Date(today().getFullYear(), today().getMonth(), 1),
    selected: today(),
    mode: "motivation"
  };

  // A shared link (?date=YYYY-MM-DD&mode=verse|motivation) opens straight to that day.
  (function applyQueryState() {
    const params = new URLSearchParams(location.search);
    const modeParam = params.get("mode");
    if (modeParam === "verse" || modeParam === "motivation") state.mode = modeParam;

    const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(params.get("date") || "");
    if (dateMatch) {
      const d = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
      if (!Number.isNaN(d.getTime())) {
        state.selected = d;
        state.view = new Date(d.getFullYear(), d.getMonth(), 1);
      }
    }
    modeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
  })();

  // The same date always gives the same entry; consecutive days jump around the list.
  function entryFor(date) {
    const { items, step } = MODES[state.mode];
    const dayNumber = Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / DAY_MS);
    const i = (((dayNumber * step) % items.length) + items.length) % items.length;
    return items[i];
  }

  function renderCalendar() {
    const y = state.view.getFullYear();
    const m = state.view.getMonth();
    const now = today();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
    const total = new Date(y, m + 1, 0).getDate();
    const selectedInView = state.selected.getFullYear() === y && state.selected.getMonth() === m;
    const tabDay = selectedInView ? state.selected.getDate() : 1;

    monthLabel.textContent = `${MONTHS[m]} ${y}`;
    grid.textContent = "";

    for (let i = 0; i < offset; i++) {
      const b = document.createElement("span");
      b.className = "blank";
      grid.appendChild(b);
    }

    for (let day = 1; day <= total; day++) {
      const date = new Date(y, m, day);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day";
      btn.textContent = day;
      btn.dataset.ts = date.getTime();
      btn.tabIndex = day === tabDay ? 0 : -1;

      const future = date > now;
      if (future) btn.classList.add("locked");
      if (sameDay(date, now)) { btn.classList.add("today"); btn.setAttribute("aria-current", "date"); }
      if (sameDay(date, state.selected)) { btn.classList.add("selected"); btn.setAttribute("aria-pressed", "true"); }
      else btn.setAttribute("aria-pressed", "false");

      btn.setAttribute("aria-label", `${longDate(date)}${future ? ", locked" : ""}`);
      grid.appendChild(btn);
    }
  }

  // Fills a card element (side panel or popup) for the selected date and mode.
  function fillCard(el) {
    const d = state.selected;
    const now = today();
    const mode = MODES[state.mode];
    const locked = d > now;

    el.classList.toggle("is-locked", locked);
    el.replaceChildren();

    const numeral = document.createElement("div");
    numeral.className = "numeral";
    numeral.textContent = d.getDate();
    numeral.setAttribute("aria-hidden", "true");

    const dayRow = document.createElement("div");
    dayRow.className = "day-row";
    dayRow.append(numeral);

    const body = document.createElement("div");

    if (locked) {
      const daysAway = Math.round((d - now) / DAY_MS);
      const title = document.createElement("p");
      title.className = "lock-title";
      title.textContent = `This ${mode.noun} is locked`;
      const note = document.createElement("p");
      note.className = "lock-note";
      note.textContent = `It opens on ${longDate(d)}, ${daysAway === 1 ? "tomorrow" : `${daysAway} days from now`}.`;
      body.append(title, note);
    } else {
      const entry = entryFor(d);
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = sameDay(d, now) ? `Today, ${longDate(d)}` : longDate(d);
      const bq = document.createElement("blockquote");
      bq.textContent = entry.t;
      const who = document.createElement("p");
      who.className = "author";
      who.textContent = mode.credit(entry.a);
      body.append(meta, bq, who);
    }

    el.append(dayRow, body);
  }

  function animate(el) {
    el.classList.remove("swap");
    void el.offsetWidth; // restart the animation
    el.classList.add("swap");
  }

  function updateShareButtons() {
    const locked = state.selected > today();
    shareBtn.disabled = locked;
    dialogShareBtn.disabled = locked;
  }

  function renderPanel() {
    fillCard(panel);
    animate(panel);
    updateShareButtons();
  }

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);

  function showPopup() {
    fillCard(dialogCard);

    const el = grid.querySelector(`[data-ts="${date.getTime()}"]`);

  function selectDate(date) {
    state.selected = date;
    renderCalendar();
    renderPanel();
    focusDay(date);
    if (mobileQuery.matches) showPopup();

  function setMode(mode) {
    state.mode = mode;
    modeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));

    if (dialog.open) {
      fillCard(dialogCard);
      dialogCard.querySelector(".day-row").append(dialogShareBtn);

  modeButtons.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".day");
    if (btn) selectDate(new Date(Number(btn.dataset.ts)));
  });

  grid.addEventListener("keydown", e => {
    const btn = e.target.closest(".day");
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!btn || !step) return;
    e.preventDefault();
    const from = new Date(Number(btn.dataset.ts));
    const to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + step);
    state.view = new Date(to.getFullYear(), to.getMonth(), 1);
    renderCalendar();
    focusDay(to);
  });

  function shiftMonth(n) {
    state.view = new Date(state.view.getFullYear(), state.view.getMonth() + n, 1);
    renderCalendar();
  }

  document.getElementById("prevBtn").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("nextBtn").addEventListener("click", () => shiftMonth(1));
  document.getElementById("todayBtn").addEventListener("click", () => {
    const t = today();
    state.view = new Date(t.getFullYear(), t.getMonth(), 1);
    selectDate(t);
  });

  async function shareCard(triggerBtn) {
    if (triggerBtn.disabled) return;

    const date = state.selected;
    const dateIso = iso(date);
    const pageUrl = `${location.origin}${location.pathname}?date=${dateIso}&mode=${state.mode}`;
    const shareData = { title: "Motivation Calendar", url: pageUrl };

    shareBtn.disabled = true;
    dialogShareBtn.disabled = true;
    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else {
        await navigator.clipboard.writeText(pageUrl);
        showToast("Link copied to clipboard");
      }
    } catch (err) {
      if (err && err.name !== "AbortError") {
        try {
          await navigator.clipboard.writeText(pageUrl);
          showToast("Sharing failed — link copied instead");
        } catch (_) {
          showToast("Sharing isn't available here");
        }
      }
    } finally {
      updateShareButtons();
    }
  }

  shareBtn.addEventListener("click", () => shareCard(shareBtn));
  dialogShareBtn.addEventListener("click", () => shareCard(dialogShareBtn));

  // Popup: close button, tap outside the card, and Esc (built in)
  document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

  // Contact card: avatar bubble opens a WhatsApp-style chat modal
  const contactBtn = document.getElementById("contactBtn");
  const contactDialog = document.getElementById("contactDialog");
  const waTypingBubble = document.getElementById("waTypingBubble");
  const waMsgBubble = document.getElementById("waMsgBubble");
  const waTyped = document.getElementById("waTyped");
  const waContactBubble = document.getElementById("waContactBubble");
  const GREETING = "Greetings earthling, I hope you are motivated.";

  let waTimers = [];
  const clearWaTimers = () => { waTimers.forEach(clearTimeout); waTimers = []; };

  function playContactChat() {
    clearWaTimers();
    waTypingBubble.hidden = false;
    waMsgBubble.hidden = true;
    waContactBubble.hidden = true;
    waTyped.textContent = "";

    waTimers.push(setTimeout(() => {
      waTypingBubble.hidden = true;
      waMsgBubble.hidden = false;
      let i = 0;
      const typeNext = () => {
        waTyped.textContent = GREETING.slice(0, i);
        i++;
        if (i <= GREETING.length) {
          waTimers.push(setTimeout(typeNext, 28));
        } else {
          waTimers.push(setTimeout(() => { waContactBubble.hidden = false; }, 300));
        }
      };
      typeNext();
    }, 900));
  }

  contactBtn.addEventListener("click", () => {
    if (!contactDialog.open) {
      contactDialog.showModal();
      playContactChat();
    }
  });
  document.getElementById("contactClose").addEventListener("click", () => contactDialog.close());
  contactDialog.addEventListener("click", e => { if (e.target === contactDialog) contactDialog.close(); });
  contactDialog.addEventListener("close", clearWaTimers);

  // Rotating a tablet or resizing to desktop width: the side panel takes over
  mobileQuery.addEventListener("change", () => {
    if (!mobileQuery.matches && dialog.open) dialog.close();
  });

  renderCalendar();
  renderPanel();
  showPopup();
</script>
</body>
</html>
