<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motivation Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #14213d;
    --chalk: #f2f4f8;
    --paper: #ffffff;
    --sun: #ffcf33;
    --mute: #6b7691;
    --line: #d5dbe7;
    --lock: #a4adc2;
    --panel-mute: #9aa6c4;
    --ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--chalk);
    color: var(--ink);
    font-family: var(--ui);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 20px 56px;
  }

  header { padding-right: 64px; }

  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.7rem, 5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  header p {
    margin: 0 0 24px;
    color: var(--mute);
    font-size: 0.98rem;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 440px) 1fr;
    gap: 24px;
    align-items: stretch;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Mode switch ---------- */
  .mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    flex: none;
  }

  .mode button {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    height: 40px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode button:not([aria-pressed="true"]):hover { background: var(--chalk); }
  .mode button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- Calendar ---------- */
  .cal {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 18px;
    padding: 16px;
  }

  .cal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex: none;
  }

  .cal-head h2 {
    flex: 1;
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .icon-btn, .text-btn {
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .icon-btn { width: 38px; height: 38px; font-size: 1.2rem; line-height: 1; }
  .text-btn { height: 38px; padding: 0 14px; font-size: 0.9rem; font-weight: 600; }
  .icon-btn:hover, .text-btn:hover { border-color: var(--ink); background: var(--chalk); }

  .dow, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .dow span {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--mute);
    padding-bottom: 6px;
  }

  .day {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    aspect-ratio: 1;
    min-height: 0;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .day:hover { background: var(--chalk); }

  .day.today { background: var(--sun); }
  .day.today:hover { background: #ffc61a; }

  .day.selected { background: var(--ink); color: #fff; }
  .day.today.selected { color: var(--sun); box-shadow: inset 0 0 0 2px var(--sun); }

  .day.locked {
    color: var(--lock);
    font-weight: 400;
    border: 1.5px dashed var(--line);
  }
  .day.locked:hover { background: transparent; border-color: var(--lock); }
  .day.locked.selected { background: var(--chalk); color: var(--mute); border-color: var(--mute); }

  .blank { visibility: hidden; }

  :focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .day.selected:focus-visible { outline-color: var(--sun); }

  /* ---------- Quote / verse card (side panel + popup) ---------- */
  .card {
    background: var(--ink);
    color: var(--chalk);
    border-radius: 18px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel { align-self: stretch; min-height: 340px; }

  .card .numeral {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(3.4rem, 9vw, 4.8rem);
    line-height: 0.9;
    color: var(--sun);
  }

  .card .meta {
    margin: 0 0 12px;
    font-size: 0.9rem;
    color: var(--panel-mute);
  }

  .card blockquote {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(1.3rem, 4.6vw, 1.7rem);
    line-height: 1.35;
    font-weight: 500;
  }

  .card .author {
    margin: 16px 0 0;
    font-size: 0.95rem;
    color: var(--panel-mute);
  }

  .card.is-locked .numeral { color: #56648a; }
  .card.is-locked .lock-title { margin: 0 0 6px; font-size: 1.3rem; font-weight: 600; }
  .card.is-locked .lock-note { margin: 0; color: var(--panel-mute); }

  .swap { animation: swap 0.22s ease-out; }
  @keyframes swap {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Popup (mobile) ---------- */
  dialog {
    width: min(92vw, 460px);
    max-width: none;
    max-height: 88dvh;
    margin: auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    overflow: visible;
  }
  dialog::backdrop { background: rgba(10, 16, 32, 0.62); }
  dialog[open] { animation: pop 0.2s ease-out; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .dialog-inner { position: relative; }
  .dialog-inner .card { padding: 26px 24px 28px; }

  .dialog-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 38px;
    height: 38px;
    font: inherit;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--chalk);
    background: transparent;
    border: 1.5px solid #3b4a72;
    border-radius: 50%;
    cursor: pointer;
  }
  .dialog-close:hover { border-color: var(--panel-mute); }
  .dialog-close:focus-visible { outline-color: var(--sun); }

  /* ---------- Email bubble ---------- */
  .mail-bubble {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: var(--ink);
    background: var(--sun);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 4px 14px rgba(20, 33, 61, 0.25);
    transition: transform 0.15s;
  }
  .mail-bubble:hover { transform: scale(1.07); }

  /* ---------- Desktop: quote appears on the right ---------- */
  @media (min-width: 900px) {
    .card blockquote { font-size: 1.85rem; }
    .panel { padding: 36px; }
  }

  /* ---------- Mobile: everything fits the screen, no scrolling ---------- */
  @media (max-width: 899px) {
    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 12px 12px;
      overflow: hidden;
    }

    header h1 { margin: 0; font-size: 1.35rem; }
    header p { display: none; }
    header { flex: none; min-height: 48px; display: flex; align-items: center; }

    .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .left { flex: 1; min-height: 0; }
    .panel { display: none; }

    .cal {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 540px;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .cal-head { margin-bottom: 8px; }
    .cal-head { gap: 6px; }
    .cal-head h2 { font-size: 1.1rem; white-space: nowrap; }
    .icon-btn, .text-btn { height: 36px; }
    .icon-btn { width: 36px; }
    .dow { flex: none; }
    .dow span { padding-bottom: 4px; }

    .grid { flex: 1 1 0; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
    .day { aspect-ratio: auto; height: 100%; }
  }

  @media (max-width: 360px) {
    .cal-head h2 { font-size: 1rem; }
    .text-btn { padding: 0 9px; font-size: 0.8rem; }
    .icon-btn { width: 32px; }
  }

  /* Short landscape screens: let the page scroll instead of squashing */
  @media (max-width: 899px) and (max-height: 480px) {
    .app { height: auto; min-height: 100dvh; overflow: visible; }
    .cal { max-height: none; }
    .grid { grid-auto-rows: minmax(34px, auto); }
  }

  @media (prefers-reduced-motion: reduce) {
    .swap, dialog[open] { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

<body>
<main class="app">
  <header>
    <div>
      <h1>Motivation Calendar</h1>
      <p>Pick a day to read its quote or verse. Days ahead unlock when they arrive.</p>
    </div>
  </header>

  <div class="layout">
    <div class="left">
      <div class="mode" role="group" aria-label="Content type">
        <button type="button" data-mode="verse" aria-pressed="false">Bible Verse</button>
        <button type="button" data-mode="motivation" aria-pressed="true">Motivation</button>
      </div>

      <section class="cal" aria-label="Calendar">
        <div class="cal-head">
          <h2 id="monthLabel" aria-live="polite"></h2>
          <button class="text-btn" id="todayBtn" type="button">Today</button>
          <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous month">&#8249;</button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="Next month">&#8250;</button>
        </div>
        <div class="dow" aria-hidden="true">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>

    <section class="card panel" id="quotePanel" aria-live="polite"></section>
  </div>
</main>

<dialog id="quoteDialog" aria-label="Daily message">
  <div class="dialog-inner">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="Close">&times;</button>
    <div class="card" id="dialogCard"></div>
  </div>
</dialog>

<a class="mail-bubble" href="mailto:kevinmalomba@gmail.com?subject=Hello%20from%20Motivation%20Calendar" aria-label="Send an email" title="Send an email">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
    <path d="m3 7 9 6 9-6"></path>
  </svg>
</a>

<script>
  const QUOTES = [
    { t: "The journey of a thousand miles begins with a single step.", a: "Lao Tzu" },
    { t: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", a: "Will Durant" },
    { t: "Courage was not the absence of fear, but the triumph over it.", a: "Nelson Mandela" },
    { t: "Start where you are. Use what you have. Do what you can.", a: "Arthur Ashe" },
    { t: "Success is the sum of small efforts, repeated day in and day out.", a: "Robert Collier" },
    { t: "It does not matter how slowly you go as long as you do not stop.", a: "Confucius" },
    { t: "Fall seven times, stand up eight.", a: "Japanese proverb" },
    { t: "The best way out is always through.", a: "Robert Frost" },
    { t: "Do the difficult things while they are easy and the great things while they are small.", a: "Lao Tzu" },
    { t: "He who has a why to live can bear almost any how.", a: "Friedrich Nietzsche" },
    { t: "Perseverance is not a long race; it is many short races one after the other.", a: "Walter Elliot" },
    { t: "The man who moves a mountain begins by carrying away small stones.", a: "Confucius" },
    { t: "It is not the mountain we conquer, but ourselves.", a: "Edmund Hillary" },
    { t: "Energy and persistence conquer all things.", a: "Benjamin Franklin" },
    { t: "Luck is what happens when preparation meets opportunity.", a: "Seneca" },
    { t: "Difficulties strengthen the mind, as labor does the body.", a: "Seneca" },
    { t: "Begin at once to live, and count each separate day as a separate life.", a: "Seneca" },
    { t: "What stands in the way becomes the way.", a: "Marcus Aurelius" },
    { t: "Waste no more time arguing what a good person should be. Be one.", a: "Marcus Aurelius" },
    { t: "The best time to plant a tree was twenty years ago. The second best time is now.", a: "Proverb" },
    { t: "A river cuts through rock, not because of its power, but because of its persistence.", a: "Jim Watkins" },
    { t: "Small deeds done are better than great deeds planned.", a: "Peter Marshall" },
    { t: "Discipline is the bridge between goals and accomplishment.", a: "Jim Rohn" },
    { t: "What you do today can improve all your tomorrows.", a: "Ralph Marston" },
    { t: "Act as if what you do makes a difference. It does.", a: "William James" },
    { t: "Fortune favors the bold.", a: "Latin proverb" },
    { t: "Well done is better than well said.", a: "Benjamin Franklin" },
    { t: "You miss 100% of the shots you don't take.", a: "Wayne Gretzky" },
    { t: "Hard work beats talent when talent doesn't work hard.", a: "Tim Notke" },
    { t: "Do not wait to strike till the iron is hot; make it hot by striking.", a: "W. B. Yeats" },
    { t: "A smooth sea never made a skilled sailor.", a: "Proverb" },
    { t: "Nothing in life is to be feared, it is only to be understood.", a: "Marie Curie" },
    { t: "The only way to do great work is to love what you do.", a: "Steve Jobs" },
    { t: "Do what you can, with what you have, where you are.", a: "Theodore Roosevelt" },
    { t: "Well begun is half done.", a: "Proverb" },
    { t: "Slow and steady wins the race.", a: "Aesop" },
    { t: "No rain, no flowers.", a: "Proverb" },
    { t: "Every day is a new beginning. Take a deep breath and start again.", a: "Proverb" },
    { t: "Rome wasn't built in a day, but they were laying bricks every hour.", a: "Proverb" },
    { t: "The expert in anything was once a beginner.", a: "Helen Hayes" },
    { t: "Patience is bitter, but its fruit is sweet.", a: "Proverb" },
    { t: "The harder the conflict, the more glorious the triumph.", a: "Thomas Paine" },
    { t: "You do not rise to the level of your goals. You fall to the level of your systems.", a: "James Clear" },
    { t: "Progress, not perfection.", a: "Proverb" }
  ];

  // King James Version (public domain)
  const VERSES = [
    { t: "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", a: "Joshua 1:9" },
    { t: "I can do all things through Christ which strengtheneth me.", a: "Philippians 4:13" },
    { t: "God is our refuge and strength, a very present help in trouble.", a: "Psalm 46:1" },
    { t: "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.", a: "Isaiah 41:10" },
    { t: "Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.", a: "Proverbs 3:5-6" },
    { t: "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.", a: "Jeremiah 29:11" },
    { t: "The LORD is my shepherd; I shall not want.", a: "Psalm 23:1" },
    { t: "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", a: "Romans 8:28" },
    { t: "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", a: "Matthew 6:33" },
    { t: "But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", a: "Isaiah 40:31" },
    { t: "The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?", a: "Psalm 27:1" },
    { t: "And let us not be weary in well doing: for in due season we shall reap, if we faint not.", a: "Galatians 6:9" },
    { t: "This is the day which the LORD hath made; we will rejoice and be glad in it.", a: "Psalm 118:24" },
    { t: "Come unto me, all ye that labour and are heavy laden, and I will give you rest.", a: "Matthew 11:28" },
    { t: "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", a: "2 Timothy 1:7" },
    { t: "I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth.", a: "Psalm 121:1-2" },
    { t: "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", a: "John 16:33" },
    { t: "Rejoicing in hope; patient in tribulation; continuing instant in prayer.", a: "Romans 12:12" },
    { t: "Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.", a: "Psalm 37:5" },
    { t: "Commit thy works unto the LORD, and thy thoughts shall be established.", a: "Proverbs 16:3" },
    { t: "Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.", a: "Deuteronomy 31:6" },
    { t: "Thy word is a lamp unto my feet, and a light unto my path.", a: "Psalm 119:105" },
    { t: "It is of the LORD'S mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.", a: "Lamentations 3:22-23" },
    { t: "And whatsoever ye do, do it heartily, as to the Lord, and not unto men.", a: "Colossians 3:23" },
    { t: "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", a: "1 Corinthians 15:58" },
    { t: "Now faith is the substance of things hoped for, the evidence of things not seen.", a: "Hebrews 11:1" },
    { t: "O taste and see that the LORD is good: blessed is the man that trusteth in him.", a: "Psalm 34:8" },
    { t: "Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.", a: "Isaiah 26:3" },
    { t: "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", a: "Philippians 4:6" },
    { t: "The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", a: "Nahum 1:7" },
    { t: "For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.", a: "Psalm 30:5" },
    { t: "Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", a: "Proverbs 27:17" },
    { t: "Whatsoever thy hand findeth to do, do it with thy might.", a: "Ecclesiastes 9:10" },
    { t: "A man's heart deviseth his way: but the LORD directeth his steps.", a: "Proverbs 16:9" },
    { t: "Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.", a: "Psalm 55:22" },
    { t: "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", a: "Micah 6:8" },
    { t: "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", a: "Romans 15:13" },
    { t: "But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible.", a: "Matthew 19:26" },
    { t: "Casting all your care upon him; for he careth for you.", a: "1 Peter 5:7" },
    { t: "So teach us to number our days, that we may apply our hearts unto wisdom.", a: "Psalm 90:12" },
    { t: "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", a: "James 1:5" },
    { t: "What shall we then say to these things? If God be for us, who can be against us?", a: "Romans 8:31" },
    { t: "I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.", a: "Psalm 32:8" },
    { t: "Keep thy heart with all diligence; for out of it are the issues of life.", a: "Proverbs 4:23" },
    { t: "For we walk by faith, not by sight.", a: "2 Corinthians 5:7" }
  ];

  // step must not share a factor with the list length, so every entry is used before any repeats
  const MODES = {
    motivation: { items: QUOTES, step: 37, noun: "quote", credit: a => a },
    verse:      { items: VERSES, step: 41, noun: "verse", credit: a => `${a} (KJV)` }
  };

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const DAY_MS = 86400000;

  const grid = document.getElementById("grid");
  const panel = document.getElementById("quotePanel");
  const dialog = document.getElementById("quoteDialog");
  const dialogCard = document.getElementById("dialogCard");
  const monthLabel = document.getElementById("monthLabel");
  const modeButtons = document.querySelectorAll(".mode button");
  const mobileQuery = window.matchMedia("(max-width: 899px)");

  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = () => startOfDay(new Date());
  const sameDay = (a, b) => a.getTime() === b.getTime();
  const longDate = d => `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

  const state = {
    view: new Date(today().getFullYear(), today().getMonth(), 1),
    selected: today(),
    mode: "motivation"
  };

  // The same date always gives the same entry; consecutive days jump around the list.
  function entryFor(date) {
    const { items, step } = MODES[state.mode];
    const dayNumber = Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / DAY_MS);
    const i = (((dayNumber * step) % items.length) + items.length) % items.length;
    return items[i];
  }

  function renderCalendar() {
    const y = state.view.getFullYear();
    const m = state.view.getMonth();
    const now = today();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
    const total = new Date(y, m + 1, 0).getDate();
    const selectedInView = state.selected.getFullYear() === y && state.selected.getMonth() === m;
    const tabDay = selectedInView ? state.selected.getDate() : 1;

    monthLabel.textContent = `${MONTHS[m]} ${y}`;
    grid.textContent = "";

    for (let i = 0; i < offset; i++) {
      const b = document.createElement("span");
      b.className = "blank";
      grid.appendChild(b);
    }

    for (let day = 1; day <= total; day++) {
      const date = new Date(y, m, day);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day";
      btn.textContent = day;
      btn.dataset.ts = date.getTime();
      btn.tabIndex = day === tabDay ? 0 : -1;

      const future = date > now;
      if (future) btn.classList.add("locked");
      if (sameDay(date, now)) { btn.classList.add("today"); btn.setAttribute("aria-current", "date"); }
      if (sameDay(date, state.selected)) { btn.classList.add("selected"); btn.setAttribute("aria-pressed", "true"); }
      else btn.setAttribute("aria-pressed", "false");

      btn.setAttribute("aria-label", `${longDate(date)}${future ? ", locked" : ""}`);
      grid.appendChild(btn);
    }
  }

  // Fills a card element (side panel or popup) for the selected date and mode.
  function fillCard(el) {
    const d = state.selected;
    const now = today();
    const mode = MODES[state.mode];
    const locked = d > now;

    el.classList.toggle("is-locked", locked);
    el.replaceChildren();

    const numeral = document.createElement("div");
    numeral.className = "numeral";
    numeral.textContent = d.getDate();
    numeral.setAttribute("aria-hidden", "true");

    const body = document.createElement("div");

    if (locked) {
      const daysAway = Math.round((d - now) / DAY_MS);
      const title = document.createElement("p");
      title.className = "lock-title";
      title.textContent = `This ${mode.noun} is locked`;
      const note = document.createElement("p");
      note.className = "lock-note";
      note.textContent = `It opens on ${longDate(d)}, ${daysAway === 1 ? "tomorrow" : `${daysAway} days from now`}.`;
      body.append(title, note);
    } else {
      const entry = entryFor(d);
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = sameDay(d, now) ? `Today, ${longDate(d)}` : longDate(d);
      const bq = document.createElement("blockquote");
      bq.textContent = entry.t;
      const who = document.createElement("p");
      who.className = "author";
      who.textContent = mode.credit(entry.a);
      body.append(meta, bq, who);
    }

    el.append(numeral, body);
  }

  function animate(el) {
    el.classList.remove("swap");
    void el.offsetWidth; // restart the animation
    el.classList.add("swap");
  }

  function renderPanel() {
    fillCard(panel);
    animate(panel);
  }

  function showPopup() {
    fillCard(dialogCard);
    if (!dialog.open) dialog.showModal();
  }

  function focusDay(date) {
    const el = grid.querySelector(`[data-ts="${date.getTime()}"]`);
    if (el) el.focus();
  }

  function selectDate(date) {
    state.selected = date;
    renderCalendar();
    renderPanel();
    focusDay(date);
    if (mobileQuery.matches) showPopup();
  }

  function setMode(mode) {
    state.mode = mode;
    modeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    renderPanel();
    if (dialog.open) fillCard(dialogCard);
  }

  modeButtons.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".day");
    if (btn) selectDate(new Date(Number(btn.dataset.ts)));
  });

  grid.addEventListener("keydown", e => {
    const btn = e.target.closest(".day");
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!btn || !step) return;
    e.preventDefault();
    const from = new Date(Number(btn.dataset.ts));
    const to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + step);
    state.view = new Date(to.getFullYear(), to.getMonth(), 1);
    renderCalendar();
    focusDay(to);
  });

  function shiftMonth(n) {
    state.view = new Date(state.view.getFullYear(), state.view.getMonth() + n, 1);
    renderCalendar();
  }

  document.getElementById("prevBtn").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("nextBtn").addEventListener("click", () => shiftMonth(1));
  document.getElementById("todayBtn").addEventListener("click", () => {
    const t = today();
    state.view = new Date(t.getFullYear(), t.getMonth(), 1);
    selectDate(t);
  });

  // Popup: close button, tap outside the card, and Esc (built in)
  document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

  // Rotating a tablet or resizing to desktop width: the side panel takes over
  mobileQuery.addEventListener("change", () => {
    if (!mobileQuery.matches && dialog.open) dialog.close();
  });

  renderCalendar();
  renderPanel();
</script>
</body>
</html>
